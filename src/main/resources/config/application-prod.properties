# Production secrets may be injected through Docker environment variables
# or mounted under /run/secrets with names matching the placeholders below.
# Legacy service hosts and bucket below identify existing infrastructure, not the app brand.
# The public domain / passkey switch is prepared separately in application-popcorn.properties.

### ------------ General Config -----------------------
spring.config.import=optional:configtree:/run/secrets/,optional:configtree:/run/secrets/movie-concierge/
popcorn-society.identity.backend-host=${backend_address}
popcorn-society.identity.frontend-host=${frontend_address}


### ------------ Movie Concierge MCP -----------------
spring.ai.mcp.server.enabled=${movie_concierge_mcp_enabled:false}
popcorn-society.assistant.mcp.bearer-token=${movie_concierge_mcp_bearer_token:}


### ------------ Distributed Tracing -----------------
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT}
management.opentelemetry.tracing.export.otlp.timeout=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TIMEOUT:5s}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}


### ------------ Database Config ----------------------
spring.datasource.url=jdbc:postgresql://imdb-clone-postgresql:5432/movie_db
spring.datasource.username=${postgresql_username}
spring.datasource.password=${postgresql_password}


### ------------ Documentation Config -----------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


### ------------ Email Config -------------------------
popcorn-society.identity.email-verification-enabled=false
popcorn-society.notification.email.sender=${mail_username}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}


### ------------ OpenSearch Config -----------------
opensearch.uris=http://imdb-clone-opensearch.databases.svc.cluster.local:9200
opensearch.username=${opensearch_username:}
opensearch.password=${opensearch_password:}


### ------------ Object Storage Config ----------------
popcorn-society.media.storage.uri=http://imdb-clone-rustfs:9000
popcorn-society.media.storage.access-key=${object_storage_access_key}
popcorn-society.media.storage.secret-key=${object_storage_secret_key}
popcorn-society.media.storage.bucket-name=imdb-clone


### ------------ Security Config ---------------------
server.servlet.session.cookie.secure=true
popcorn-society.identity.webauthn.rp-id=imdb-clone.the-coding-lab.com
popcorn-society.identity.webauthn.allowed-origins=https://imdb-clone.the-coding-lab.com
spring.security.oauth2.client.registration.google.client-id=${google_client_id}
spring.security.oauth2.client.registration.google.client-secret=${google_client_secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=${github_client_id}
spring.security.oauth2.client.registration.github.client-secret=${github_client_secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      agent-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Keep immutable action SHAs current through reviewable version-update PRs.
    open-pull-requests-limit: 5
    groups:
      actions-version:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

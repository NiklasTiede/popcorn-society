name: CD - Versioned app release

on:
  workflow_run:
    workflows:
      - CI - Build / Test Deployables
    branches:
      - master
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: versioned-app-release
  cancel-in-progress: false

jobs:
  release-app:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Artifact downloads, deployment refs, and the deployment PR need these scopes.
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be semver without leading v, got: $version" >&2
            exit 1
          fi
          {
            echo "value=$version"
            echo "tag=v$version"
            echo "branch=release/v${version}-deployment"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure release refs do not exist
        run: |
          if git rev-parse --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "Release tag ${{ steps.version.outputs.tag }} already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin \
            "refs/heads/${{ steps.version.outputs.branch }}" >/dev/null; then
            echo "Release branch ${{ steps.version.outputs.branch }} already exists" >&2
            exit 1
          fi

      - name: Set up JDK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        if: github.event_name == 'workflow_dispatch'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Build and test backend
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew build jacocoTestReport copyPyroscopeAgent

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        if: github.event_name == 'workflow_dispatch'
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Generate frontend API client
        if: github.event_name == 'workflow_dispatch'
        working-directory: frontend
        run: yarn run build:moviesGen

      - name: Lint frontend
        if: github.event_name == 'workflow_dispatch'
        working-directory: frontend
        run: yarn lint

      - name: Test frontend
        if: github.event_name == 'workflow_dispatch'
        working-directory: frontend
        run: yarn test

      - name: Build frontend
        if: github.event_name == 'workflow_dispatch'
        working-directory: frontend
        run: yarn build

      - name: Install uv and Python 3.14
        if: github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install locked agent dependencies
        if: github.event_name == 'workflow_dispatch'
        run: make agent-sync

      - name: Verify agent
        if: github.event_name == 'workflow_dispatch'
        run: make verify-agent

      - name: Build manual release images
        if: github.event_name == 'workflow_dispatch'
        run: |
          make docker-build-backend-prebuilt
          make docker-build-frontend-prebuilt
          make docker-build-agent AGENT_APP_VERSION="${{ steps.version.outputs.value }}"

      - name: Smoke-test manual release images
        if: github.event_name == 'workflow_dispatch'
        run: |
          make container-smoke-backend
          make container-smoke-frontend
          make container-smoke-agent

      - name: Download verified backend image
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-backend-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release-images/backend
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download verified frontend image
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-frontend-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release-images/frontend
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download verified agent image
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-agent-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release-images/agent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate and load verified release images
        if: github.event_name == 'workflow_run'
        run: |
          for service in backend frontend agent; do
            archive="$RUNNER_TEMP/release-images/${service}/${service}-image.tar.gz"
            test -f "$archive"
            test ! -L "$archive"
            gzip -t "$archive"
          done
          gzip -dc "$RUNNER_TEMP/release-images/backend/backend-image.tar.gz" | docker load
          gzip -dc "$RUNNER_TEMP/release-images/frontend/frontend-image.tar.gz" | docker load
          gzip -dc "$RUNNER_TEMP/release-images/agent/agent-image.tar.gz" | docker load

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified release images
        run: |
          for service in backend frontend agent; do
            local_image="popcorn-society-${service}:local"
            release_image="${{ secrets.DOCKERHUB_USERNAME }}/popcorn-society-${service}:${{ steps.version.outputs.tag }}"
            latest_image="${{ secrets.DOCKERHUB_USERNAME }}/popcorn-society-${service}:latest"
            docker tag "$local_image" "$release_image"
            docker tag "$local_image" "$latest_image"
            docker push "$release_image"
            docker push "$latest_image"
          done

      - name: Resolve image digests
        id: digests
        run: |
          backend_image="${{ secrets.DOCKERHUB_USERNAME }}/popcorn-society-backend:${{ steps.version.outputs.tag }}"
          frontend_image="${{ secrets.DOCKERHUB_USERNAME }}/popcorn-society-frontend:${{ steps.version.outputs.tag }}"
          agent_image="${{ secrets.DOCKERHUB_USERNAME }}/popcorn-society-agent:${{ steps.version.outputs.tag }}"
          backend_digest="$(docker buildx imagetools inspect "$backend_image" --format '{{.Manifest.Digest}}')"
          frontend_digest="$(docker buildx imagetools inspect "$frontend_image" --format '{{.Manifest.Digest}}')"
          agent_digest="$(docker buildx imagetools inspect "$agent_image" --format '{{.Manifest.Digest}}')"
          {
            echo "backend=${backend_digest}"
            echo "frontend=${frontend_digest}"
            echo "agent=${agent_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Update home-cluster app image manifests
        run: |
          python3 scripts/update-release-manifests.py \
            --registry "${{ secrets.DOCKERHUB_USERNAME }}" \
            --version "${{ steps.version.outputs.value }}" \
            --backend-digest "${{ steps.digests.outputs.backend }}" \
            --frontend-digest "${{ steps.digests.outputs.frontend }}" \
            --agent-digest "${{ steps.digests.outputs.agent }}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Verify Movie Concierge production contracts
        run: make verify-movie-concierge-production
        env:
          EXPECTED_APP_VERSION: ${{ steps.version.outputs.value }}

      - name: Render and validate observability charts
        run: make verify-observability-charts

      - name: Validate rendered Kubernetes schemas
        run: make verify-kubernetes-schema

      - name: Commit deployment manifest update
        env:
          # Supply credentials only to this step's Git subprocesses; never persist them.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f'
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          if git diff --quiet infrastructure/clusters/home/apps/backend.yaml infrastructure/clusters/home/apps/frontend.yaml infrastructure/clusters/home/apps/agent.yaml; then
            echo "No deployment manifest changes for ${{ steps.version.outputs.tag }}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RELEASE_BRANCH"
          git add infrastructure/clusters/home/apps/backend.yaml infrastructure/clusters/home/apps/frontend.yaml infrastructure/clusters/home/apps/agent.yaml
          git commit -m "chore(release): deploy ${{ steps.version.outputs.tag }} image digests"
          git push --set-upstream origin "$RELEASE_BRANCH"

      - name: Create release tag
        env:
          # Supply credentials only to this step's Git subprocesses; never persist them.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" "${{ steps.source.outputs.sha }}" \
            -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create deployment pull request
        id: deployment-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          body="$(printf '%s\n' \
            "## Deployment" \
            "" \
            "Deploys the immutable backend, frontend, and Movie Concierge images published as ${RELEASE_TAG}." \
            "" \
            "The release workflow verified all three image versions and Kubernetes production contracts before opening this pull request." \
            "Merging it lets Argo CD reconcile the production cluster from Git." \
            "" \
            "This pull request was created by the versioned app release workflow.")"
          pr_url="$(gh pr create \
            --base master \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): deploy ${RELEASE_TAG}" \
            --body "$body")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment pull request"
            echo
            echo "$pr_url"
            echo
            echo "Approve its CI run, review the three digest changes, and merge it to deploy through Argo CD."
          } >> "$GITHUB_STEP_SUMMARY"

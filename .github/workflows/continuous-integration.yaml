name: CI - Build / Test Deployables

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - VERSION
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch convention
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$PR_AUTHOR" == 'dependabot[bot]' && "$PR_BRANCH" == dependabot/* ]]; then
            exit 0
          fi
          if [[ "$PR_BRANCH" =~ ^(feature|bugfix)/[a-z0-9]+(-[a-z0-9]+)*$ ]] ||
             [[ "$PR_BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+-deployment$ ]]; then
            exit 0
          fi
          echo '::error::Use feature/<kebab-case-name> or bugfix/<kebab-case-name>. Only automated deployment branches may use release/v<major>.<minor>.<patch>-deployment.'
          exit 1

  backend-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Internal PRs can reuse their own cache; fork PRs and merge groups only read.
          cache-read-only: ${{ !(github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}

      - name: Build and test Spring Boot application
        run: ./gradlew build jacocoTestReport copyPyroscopeAgent

      - name: Build backend runtime image
        run: make docker-build-backend-prebuilt

      - name: Smoke-test backend runtime image
        run: make container-smoke-backend

      - name: Export verified backend image
        if: github.event_name == 'push'
        run: docker save popcorn-society-backend:local | gzip -1 > /tmp/backend-image.tar.gz

      - name: Upload verified backend image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-backend-${{ github.sha }}
          path: /tmp/backend-image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  frontend-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Clients from OpenApi-Spec File
        run: yarn run build:moviesGen

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Build frontend runtime image
        working-directory: .
        run: make docker-build-frontend-prebuilt

      - name: Smoke-test frontend runtime image
        working-directory: .
        run: make container-smoke-frontend

      - name: Export verified frontend image
        if: github.event_name == 'push'
        working-directory: .
        run: docker save popcorn-society-frontend:local | gzip -1 > /tmp/frontend-image.tar.gz

      - name: Upload verified frontend image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-frontend-${{ github.sha }}
          path: /tmp/frontend-image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  agent-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install locked agent dependencies
        run: make agent-sync

      - name: Verify agent
        run: make verify-agent

      - name: Build agent image
        run: make docker-build-agent AGENT_APP_VERSION="$(tr -d '[:space:]' < VERSION)"

      - name: Smoke-test agent image
        run: make container-smoke-agent

      - name: Export verified agent image
        if: github.event_name == 'push'
        run: docker save popcorn-society-agent:local | gzip -1 > /tmp/agent-image.tar.gz

      - name: Upload verified agent image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-agent-${{ github.sha }}
          path: /tmp/agent-image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  infrastructure-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'

      - name: Verify Movie Concierge production contracts
        run: make verify-movie-concierge-production

      - name: Render and validate observability charts
        run: make verify-observability-charts

      - name: Validate rendered Kubernetes schemas
        run: make verify-kubernetes-schema

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "popcorn-society-agent"
version = "0.1.0"
description = "Agent orchestration service for the Popcorn Society Movie Concierge"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.128,<1",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
    "opentelemetry-instrumentation-httpx>=0.60b0,<1",
    "opentelemetry-sdk>=1.39,<2",
    "prometheus-client>=0.23,<1",
    "pydantic>=2.12,<3",
    "pydantic-ai[openai-realtime,xai-realtime]==2.53.0",
    "pydantic-settings>=2.12,<3",
    "pyroscope-io==1.2.1",
    "pyroscope-otel==1.1.0",
    "structlog>=25.5,<26",
    "uvicorn[standard]>=0.40,<1",
]

[project.scripts]
popcorn-agent-eval = "popcorn_society_agent.eval_cli:main"
popcorn-agent-voice-probe = "popcorn_society_agent.voice_probe_cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "import-linter>=2.7,<3",
    "pyright>=1.1.408,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/popcorn_society_agent"]

[tool.uv]
# Security floors for transitive runtime dependencies.
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "certifi>=2026.10.19",
    "fastmcp-slim>=3.4.10,<4",
    "mcp>=1.30.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "S",
    "SIM",
    "TC",
    "UP",
]
ignore = [
    "S104", # Binding the container server to all interfaces is intentional.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportImportCycles = "error"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["popcorn_society_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "popcorn_society_agent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The concierge Module is independent of Adapters"
type = "forbidden"
source_modules = ["popcorn_society_agent.concierge"]
forbidden_modules = ["popcorn_society_agent.adapters", "popcorn_society_agent.web", "fastapi", "pydantic_ai"]

[[tool.importlinter.contracts]]
name = "The web Adapter does not assemble outbound Adapters"
type = "forbidden"
source_modules = ["popcorn_society_agent.web"]
forbidden_modules = ["popcorn_society_agent.adapters"]

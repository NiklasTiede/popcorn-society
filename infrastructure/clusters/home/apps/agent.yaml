apiVersion: v1
kind: ServiceAccount
metadata:
  name: imdb-clone-agent
  namespace: imdb-clone
  annotations:
    argocd.argoproj.io/sync-wave: "3"
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imdb-clone-voice-quota
  namespace: imdb-clone
  annotations:
    # local-path binds only after its consuming Pod is scheduled.
    argocd.argoproj.io/sync-wave: "4"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imdb-clone-agent
  namespace: imdb-clone
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: imdb-clone-agent
    app.kubernetes.io/component: concierge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: imdb-clone-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: imdb-clone-agent
        app.kubernetes.io/component: concierge
    spec:
      serviceAccountName: imdb-clone-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: niklastiede/popcorn-society-agent:v1.7.4@sha256:d3adceb95fdc89059d6bb6ea00b3052f76540b1dcd4e43ee89860b80c3c3ee4c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: POPCORN_SOCIETY_AGENT_ENVIRONMENT
              value: production
            - name: POPCORN_SOCIETY_AGENT_MODEL_BACKEND
              value: openai
            - name: POPCORN_SOCIETY_AGENT_MODEL_NAME
              value: gpt-5.6-luna
            - name: POPCORN_SOCIETY_AGENT_MCP_URL
              value: http://imdb-clone-backend.imdb-clone.svc.cluster.local:8080/mcp
            - name: POPCORN_SOCIETY_AGENT_SECRETS_DIRECTORY
              value: /run/secrets/movie-concierge
            - name: POPCORN_SOCIETY_AGENT_VOICE_ENABLED
              value: "true"
            - name: POPCORN_SOCIETY_AGENT_VOICE_LIVE_ENABLED
              value: "true"
            - name: POPCORN_SOCIETY_AGENT_VOICE_SESSION_SECONDS
              value: "900"
            # Keep the old cap until the v1.5.0 image has been replaced; new images ignore it.
            - name: POPCORN_SOCIETY_AGENT_VOICE_MAX_SESSIONS
              value: "8"
            - name: POPCORN_SOCIETY_AGENT_VOICE_BROWSER_SECONDS
              value: "1500"
            - name: POPCORN_SOCIETY_AGENT_VOICE_SHARED_SECONDS
              value: "6000"
            - name: POPCORN_SOCIETY_AGENT_VOICE_QUOTA_DATABASE
              value: /var/lib/movie-concierge/voice-quota.db
            - name: POPCORN_SOCIETY_AGENT_VOICE_ALLOWED_ORIGINS
              value: '["https://imdb-clone.the-coding-lab.com"]'
            - name: POPCORN_SOCIETY_AGENT_ALLOWED_HOSTS
              value: '["imdb-clone.the-coding-lab.com","imdb-clone-agent","imdb-clone-agent.imdb-clone","imdb-clone-agent.imdb-clone.svc","imdb-clone-agent.imdb-clone.svc.cluster.local"]'
            - name: POPCORN_SOCIETY_AGENT_MCP_INIT_TIMEOUT_SECONDS
              value: "5"
            - name: POPCORN_SOCIETY_AGENT_MCP_READ_TIMEOUT_SECONDS
              value: "12"
            - name: POPCORN_SOCIETY_AGENT_PROVIDER_TIMEOUT_SECONDS
              value: "20"
            - name: POPCORN_SOCIETY_AGENT_RUN_TIMEOUT_SECONDS
              value: "30"
            - name: POPCORN_SOCIETY_AGENT_MAX_CONCURRENT_RUNS
              value: "2"
            - name: POPCORN_SOCIETY_AGENT_MAX_CONVERSATIONS
              value: "500"
            - name: POPCORN_SOCIETY_AGENT_MAX_REQUEST_BODY_BYTES
              value: "4096"
            - name: POPCORN_SOCIETY_AGENT_MAX_MODEL_REQUESTS
              value: "4"
            - name: POPCORN_SOCIETY_AGENT_MAX_TOOL_CALLS
              value: "6"
            - name: POPCORN_SOCIETY_AGENT_MAX_INPUT_TOKENS
              value: "24000"
            - name: POPCORN_SOCIETY_AGENT_MAX_OUTPUT_TOKENS
              value: "1500"
            - name: POPCORN_SOCIETY_AGENT_PROJECT_COST_LIMIT_USD
              value: "20.00"
            - name: POPCORN_SOCIETY_AGENT_RUN_COST_LIMIT_USD
              value: "0.25"
            - name: POPCORN_SOCIETY_AGENT_LIVE_EVALS_ENABLED
              value: "false"
            - name: POPCORN_SOCIETY_AGENT_OTEL_TRACING_ENABLED
              value: "true"
            - name: POPCORN_SOCIETY_AGENT_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318/v1/traces
            - name: POPCORN_SOCIETY_AGENT_OTEL_EXPORT_TIMEOUT_SECONDS
              value: "5"
            - name: POPCORN_SOCIETY_AGENT_OTEL_TRACE_SAMPLE_RATIO
              value: "1.0"
            - name: TMPDIR
              value: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: imdb-clone-agent.imdb-clone.svc.cluster.local
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: imdb-clone-agent.imdb-clone.svc.cluster.local
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: imdb-clone-agent.imdb-clone.svc.cluster.local
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: voice-quota
              mountPath: /var/lib/movie-concierge
            - name: runtime-secrets
              mountPath: /run/secrets/movie-concierge
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: voice-quota
          persistentVolumeClaim:
            claimName: imdb-clone-voice-quota
        - name: runtime-secrets
          secret:
            secretName: movie-concierge-runtime
            defaultMode: 0440
            items:
              - key: openai-api-key
                path: openai-api-key
              - key: mcp-bearer-token
                path: mcp-bearer-token
              - key: xai-api-key
                path: xai-api-key
              - key: openai-live-api-key
                path: openai-live-api-key
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: imdb-clone-agent
  namespace: imdb-clone
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: imdb-clone-agent
    app.kubernetes.io/component: concierge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: imdb-clone-agent
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: imdb-clone-agent
  namespace: imdb-clone
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: imdb-clone-agent
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: imdb-clone-agent
  namespaceSelector:
    matchNames:
      - imdb-clone
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

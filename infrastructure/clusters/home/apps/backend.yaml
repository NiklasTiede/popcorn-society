apiVersion: v1
kind: ServiceAccount
metadata:
  name: imdb-clone-backend
  namespace: imdb-clone
  annotations:
    argocd.argoproj.io/sync-wave: "3"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imdb-clone-backend
  namespace: imdb-clone
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: imdb-clone-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: imdb-clone-backend
    spec:
      serviceAccountName: imdb-clone-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: niklastiede/popcorn-society-backend:v1.7.4@sha256:c085589e28c54c4ca81d573131855b53862d85fc98ed982affaa583ee99fb902
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # Log, trace and profile identity changes with the compatible release image.
            - name: SPRING_APPLICATION_NAME
              value: popcorn-society-backend
            - name: NOTIFICATION_OUTBOX_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-runtime
                  key: NOTIFICATION_OUTBOX_KEY
            - name: movie_concierge_mcp_enabled
              value: "true"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://imdb-clone-postgresql.databases.svc.cluster.local:5432/movie_db
            - name: OPENSEARCH_URIS
              value: http://imdb-clone-opensearch.databases.svc.cluster.local:9200
            - name: POPCORN_SOCIETY_MEDIA_STORAGE_URI
              value: http://imdb-clone-rustfs.databases.svc.cluster.local:9000
            - name: POPCORN_SOCIETY_CATALOG_SEARCH_EMBEDDING_BASE_URL
              value: http://imdb-clone-llama-cpp.databases.svc.cluster.local:8080
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318/v1/traces
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TIMEOUT
              value: 5s
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0.1"
            - name: PYROSCOPE_APPLICATION_NAME
              value: popcorn-society-backend
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
            - name: PYROSCOPE_FORMAT
              value: jfr
            - name: PYROSCOPE_PROFILING_INTERVAL
              value: 20ms
            - name: PYROSCOPE_PROFILER_EVENT
              value: itimer
            - name: PYROSCOPE_PROFILER_ALLOC
              value: 512k
            - name: PYROSCOPE_PROFILER_LOCK
              value: 10ms
            - name: PYROSCOPE_UPLOAD_INTERVAL
              value: 15s
            - name: PYROSCOPE_PROFILE_EXPORT_TIMEOUT
              value: 5s
            - name: PYROSCOPE_INGEST_MAX_TRIES
              value: "2"
            - name: PYROSCOPE_LABELS
              value: environment=production
            - name: SPRING_APPLICATION_JSON
              value: |-
                {
                  "management": {
                    "metrics": {
                      "distribution": {
                        "percentiles-histogram": {
                          "http.server.requests": true
                        }
                      }
                    }
                  }
                }
          envFrom:
            - secretRef:
                name: backend-runtime
          volumeMounts:
            - name: movie-concierge-runtime
              mountPath: /run/secrets/movie-concierge
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: movie-concierge-runtime
          secret:
            secretName: movie-concierge-runtime
            defaultMode: 0440
            items:
              - key: mcp-bearer-token
                path: movie_concierge_mcp_bearer_token
              - key: tmdb-read-access-token
                path: TMDB_READ_ACCESS_TOKEN
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: imdb-clone-backend
  namespace: imdb-clone
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: imdb-clone-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: imdb-clone-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management

openapi: 3.1.0
info:
  title: Popcorn Society API
  version: "1"
servers:
- url: /
paths:
  /api/v1/movies/{movieId}:
    get:
      tags:
      - movie-controller
      operationId: getMovieById
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovieRecord"
    put:
      tags:
      - movie-controller
      operationId: updateMovie
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovieRecord"
    delete:
      tags:
      - movie-controller
      operationId: deleteMovie
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/v1/comments/{commentId}:
    get:
      tags:
      - comment-controller
      operationId: getCommentById
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommentRecord"
    put:
      tags:
      - comment-controller
      operationId: updateComment
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommentRecord"
    delete:
      tags:
      - comment-controller
      operationId: deleteComment
      parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/v1/accounts/{username}:
    put:
      tags:
      - account-controller
      operationId: updateAccountProfile
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRecord"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UpdatedAccountProfile"
    delete:
      tags:
      - account-controller
      operationId: deleteAccount
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
  /api/v1/accounts/{username}/roles/admin:
    put:
      tags:
      - account-controller
      operationId: giveAdminRole
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      tags:
      - account-controller
      operationId: takeAdminRole
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/accounts/me/watchlist/{movieId}:
    put:
      tags:
      - watched-movie-controller
      operationId: watchMovie
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Existing resource updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WatchedMovieRecord"
        "201":
          description: Resource created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WatchedMovieRecord"
    delete:
      tags:
      - watched-movie-controller
      operationId: deleteWatchedMovie
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/v1/accounts/me/ratings/{movieId}:
    put:
      tags:
      - rating-controller
      operationId: rateMovie
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingRequest"
        required: true
      responses:
        "200":
          description: Existing resource updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RatingRecord"
        "201":
          description: Resource created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RatingRecord"
    delete:
      tags:
      - rating-controller
      operationId: deleteRating
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/v1/search/movies:
    post:
      tags:
      - search-controller
      operationId: search
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
          minLength: 0
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieSearchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedResponseMovieRecord"
  /api/v1/search/movies/reindex:
    post:
      tags:
      - search-controller
      operationId: reindexMovies
      responses:
        "202":
          description: Reindex accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovieSearchReindexJobResponse"
        "409":
          description: Reindex already running
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovieSearchReindexJobResponse"
  /api/v1/recommendations/watchlist-tonight:
    post:
      tags:
      - recommendation-controller
      operationId: watchlistTonight
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistTonightRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WatchlistTonightResponse"
  /api/v1/recommendations/tonight:
    post:
      tags:
      - recommendation-controller
      operationId: tonight
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TonightModeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TonightModeResponse"
  /api/v1/recommendations/home-feed:
    post:
      tags:
      - recommendation-controller
      operationId: homeFeed
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeFeedRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HomeFeedResponse"
  /api/v1/recommendations/discovery-events:
    post:
      tags:
      - recommendation-controller
      operationId: recordDiscoveryEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryEventRequest"
        required: true
      responses:
        "204":
          description: No Content
  /api/v1/observability/frontend:
    post:
      tags:
      - frontend-telemetry-controller
      operationId: record
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrontendTelemetryBatch"
        required: true
      responses:
        "204":
          description: No Content
  /api/v1/movies:
    get:
      tags:
      - movie-controller
      operationId: getMoviesByIds
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            format: int64
            exclusiveMinimum: 0
          maxItems: 30
          minItems: 1
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedResponseMovieRecord"
    post:
      tags:
      - movie-controller
      operationId: createMovie
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovieRecord"
  /api/v1/movies/{movieId}/comments:
    get:
      tags:
      - comment-controller
      operationId: getCommentsByMovieId
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedResponseCommentRecord"
    post:
      tags:
      - comment-controller
      operationId: createComment
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommentRecord"
  /api/v1/media/profile-photo:
    post:
      tags:
      - file-storage-controller
      operationId: storeUserProfilePhoto
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
    delete:
      tags:
      - file-storage-controller
      operationId: deleteUserProfilePhoto
      responses:
        "204":
          description: No Content
  /api/v1/media/movies/{movieId}:
    post:
      tags:
      - file-storage-controller
      operationId: storeMovieImage
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
    delete:
      tags:
      - file-storage-controller
      operationId: deleteMovieImage
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/v1/auth/registration:
    post:
      tags:
      - authentication-controller
      operationId: registerAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/auth/password-resets:
    post:
      tags:
      - authentication-controller
      operationId: saveNewPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/auth/password-reset-requests:
    post:
      tags:
      - authentication-controller
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetEmailRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/auth/login:
    post:
      tags:
      - authentication-controller
      operationId: authenticateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountSessionResponse"
  /api/v1/auth/email-confirmations:
    post:
      tags:
      - authentication-controller
      operationId: confirmEmailAddress
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailConfirmationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/auth/concierge-delegation:
    post:
      tags:
      - concierge-delegation-controller
      operationId: createConciergeDelegation
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConciergeDelegationResponse"
  /api/v1/accounts:
    post:
      tags:
      - account-controller
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountCreated"
  /api/v1/search/movies/reindex/{jobId}:
    get:
      tags:
      - search-controller
      operationId: reindexStatus
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovieSearchReindexJobResponse"
  /api/v1/recommendations/movies/{movieId}/similar:
    get:
      tags:
      - recommendation-controller
      operationId: similarMovies
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 15
          maximum: 30
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovieRecommendationSet"
  /api/v1/recommendations/discovery-events/summary:
    get:
      tags:
      - recommendation-controller
      operationId: discoveryEventSummary
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 7
          maximum: 90
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DiscoveryEventSummary"
  /api/v1/movies/search/{primaryTitle}:
    get:
      tags:
      - movie-controller
      operationId: searchMoviesByTitle
      parameters:
      - name: primaryTitle
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedResponseMovieRecord"
      deprecated: true
  /api/v1/auth/me:
    get:
      tags:
      - authentication-controller
      operationId: currentAccount
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountSessionResponse"
  /api/v1/auth/check-username-availability:
    get:
      tags:
      - authentication-controller
      operationId: checkUsernameAvailability
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserIdentityAvailability"
  /api/v1/accounts/{username}/watchlist:
    get:
      tags:
      - account-engagement-controller
      operationId: getWatchedMoviesByAccount
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedResponseWatchedMovieRecord"
  /api/v1/accounts/{username}/ratings:
    get:
      tags:
      - account-engagement-controller
      operationId: getRatingsByAccount
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedResponseRatingRecord"
  /api/v1/accounts/{username}/profile:
    get:
      tags:
      - account-controller
      operationId: getAccountProfile
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicAccountProfile"
  /api/v1/accounts/{username}/library/watchlist:
    get:
      tags:
      - account-engagement-controller
      operationId: getWatchlistLibrary
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: ADDED_AT_DESC
          enum:
          - ADDED_AT_DESC
          - ADDED_AT_ASC
          - IMDB_DESC
          - IMDB_ASC
          - RUNTIME_DESC
          - RUNTIME_ASC
          - TITLE_ASC
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WatchlistLibraryResponse"
  /api/v1/accounts/{username}/library/ratings:
    get:
      tags:
      - account-engagement-controller
      operationId: getRatingLibrary
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: SCORE_DESC
          enum:
          - SCORE_DESC
          - SCORE_ASC
          - RATED_AT_DESC
          - RATED_AT_ASC
          - IMDB_DESC
          - IMDB_ASC
          - TITLE_ASC
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RatingLibraryResponse"
  /api/v1/accounts/{username}/comments:
    get:
      tags:
      - account-engagement-controller
      operationId: getCommentsByAccount
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedResponseCommentRecord"
  /api/v1/accounts/summaries:
    get:
      tags:
      - account-controller
      operationId: getPublicAccountSummaries
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            format: int64
            exclusiveMinimum: 0
          maxItems: 30
          minItems: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicAccountSummary"
  /api/v1/accounts/me:
    get:
      tags:
      - account-controller
      operationId: getCurrentAccount
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountSummaryResponse"
  /api/v1/accounts/me/profile:
    get:
      tags:
      - account-controller
      operationId: getCurrentAccountProfile
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountProfile"
  /api/v1/accounts/me/passkeys:
    get:
      tags:
      - passkey-management-controller
      operationId: listPasskeys
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasskeyCredentialResponse"
  /api/v1/accounts/me/passkeys/{credentialId}:
    delete:
      tags:
      - passkey-management-controller
      operationId: deletePasskey
      parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
components:
  schemas:
    MovieRequest:
      type: object
      properties:
        imdbId:
          type: string
          pattern: "^tt\\d{7,}$"
        tmdbId:
          type: integer
          format: int64
        movieType:
          type: string
